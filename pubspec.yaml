name: flutter_audit
description: A modular offline CLI tool that scans Flutter projects for unused dependencies, assets, unused files, and performance bottlenecks.
version: 1.0.0
repository: https://github.com/flutter_audit/flutter_audit

environment:
  sdk: ^3.0.0

dependencies:
  analyzer: ^6.3.0
  args: ^2.5.0
  crypto: ^3.0.3
  glob: ^2.1.2
  meta: ^1.11.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.0
